<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" />
  
  <!-- Inner White Border Glow -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />
  
  <g filter="url(#shadow)">
    <!-- Clipboard / Document Container -->
    <rect x="116" y="126" width="280" height="300" rx="24" fill="#ffffff" />
    
    <!-- Top Clip -->
    <rect x="196" y="102" width="120" height="48" rx="12" fill="#1e293b" />
    <circle cx="256" cy="126" r="10" fill="#ffffff" />
    
    <!-- Header lines on report -->
    <rect x="156" y="180" width="140" height="16" rx="8" fill="#dc2626" />
    <rect x="310" y="180" width="46" height="16" rx="8" fill="#94a3b8" />
    
    <!-- Chart Bars (Production metrics) -->
    <!-- Bar 1 -->
    <rect x="160" y="320" width="32" height="70" rx="6" fill="#3b82f6" />
    <!-- Bar 2 -->
    <rect x="208" y="270" width="32" height="120" rx="6" fill="#10b981" />
    <!-- Bar 3 -->
    <rect x="256" y="230" width="32" height="160" rx="6" fill="#dc2626" />
    <!-- Bar 4 -->
    <rect x="304" y="290" width="32" height="100" rx="6" fill="#f59e0b" />
    
    <!-- Target Line -->
    <line x1="146" y1="250" x2="366" y2="250" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,6" />
    <circle cx="366" cy="250" r="6" fill="#ef4444" />
  </g>
</svg>
